[project]
name = "deco-swarm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jax[cuda12]>=0.12.1",
    "flax>=0.12.12",
    "optax>=0.2.9",
    "numpy",
    "pyyaml>=6.0.4",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
