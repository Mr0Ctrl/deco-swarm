screen:
  width: 1280
  height: 720
  fps: 6000

agent:
  radius: 10.0 # Piksel cinsinden ajan gövde yarıçapı
  linear_speed: 180.0 # Saniyede alınan yol (piksel/sn)
  angular_speed: 200.0 # Saniyede dönüş açısı (derece/sn)

raycast:
  ray_count: 90 # Test edeceğimiz ışın sayısı
  fov_degrees: 180.0 # Görüş açısı genişliği
  max_distance: 300.0 # Işınların maksimum menzili
