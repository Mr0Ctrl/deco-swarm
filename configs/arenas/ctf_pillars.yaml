spawns:                    # [x, y, heading_deg]
  red:
    - [9.0, 16.0, 0.0]
    - [9.0, 24.0, 0.0]
    - [9.0, 20.0, 0.0]
    - [6.0, 14.0, 0.0]
    - [6.0, 26.0, 0.0]
  blue:
    - [51.0, 24.0, 180.0]
    - [51.0, 16.0, 180.0]
    - [51.0, 20.0, 180.0]
    - [54.0, 26.0, 180.0]
    - [54.0, 14.0, 180.0]

walls:
  segments:
    - [[30.0, 16.0], [30.0, 24.0]]   # [[x1, y1], [x2, y2]]
  boxes:                             # [x, y, w, h]
    - [16.0, 8.0, 5.0, 7.0]
    - [39.0, 25.0, 5.0, 7.0]
    - [16.0, 25.0, 5.0, 7.0]
    - [39.0, 8.0, 5.0, 7.0]